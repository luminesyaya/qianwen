<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen IE — 结构化信息抽取</title>
<style>
  :root {
    --bg: #0a0a1a;
    --cyan: #06d6ff; --pink: #ff2d95; --purple: #a855f7;
    --green: #39ff88; --amber: #ffb347; --blue: #4da6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: #e8eaf6; min-height: 100vh;
    overflow-x: hidden;
  }
  /* animated bg */
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(168,85,247,0.12) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(6,214,255,0.10) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255,45,149,0.06) 0%, transparent 60%);
  }
  .bg::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,255,255,0.008) 60px, rgba(255,255,255,0.008) 61px);
  }

  .app { position: relative; z-index: 1; max-width: 1060px; margin: 0 auto; padding: 40px 24px 80px; }

  /* header */
  .logo-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .logo-icon {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; box-shadow: 0 0 24px rgba(6,214,255,0.35);
  }
  h1 {
    font-size: 2rem; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, #c4b5fd, #67e8f9, #fda4af);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #94a3b8; font-size: 0.95rem; max-width: 600px; }

  .badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .badge {
    font-size: 0.78rem; padding: 6px 14px; border-radius: 20px;
    font-weight: 600;
  }
  .b-model { background: rgba(6,214,255,0.12); border: 1px solid rgba(6,214,255,0.3); color: var(--cyan); }
  .b-lora { background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.3); color: var(--purple); }
  .b-topics { background: rgba(255,179,71,0.12); border: 1px solid rgba(255,179,71,0.3); color: var(--amber); }
  .b-parse { background: rgba(57,255,136,0.12); border: 1px solid rgba(57,255,136,0.3); color: var(--green); }

  /* card */
  .card {
    background: rgba(15,15,40,0.7); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px; padding: 24px; margin-bottom: 24px;
    backdrop-filter: blur(20px); position: relative;
  }
  .card::before {
    content: ''; position: absolute; inset: -1px; border-radius: 20px; padding: 1px;
    background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(6,214,255,0.15), rgba(255,45,149,0.1));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude; pointer-events: none;
  }
  .card-header { font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 1.2px; color: #64748b; margin-bottom: 14px; }

  textarea {
    width: 100%; height: 150px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; color: #e8eaf6; padding: 18px; font-size: 0.95rem;
    resize: vertical; font-family: inherit; line-height: 1.7;
    transition: 0.25s;
  }
  textarea::placeholder { color: #3d4060; }
  textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 24px rgba(6,214,255,0.12); }

  .controls { display: flex; gap: 14px; align-items: center; margin-top: 16px; flex-wrap: wrap; }

  .task-select { display: flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 3px; border: 1px solid rgba(255,255,255,0.06); }
  .task-btn {
    padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 0.84rem; font-weight: 600; font-family: inherit;
    background: transparent; color: #64748b; transition: 0.2s;
  }
  .task-btn.active { background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(6,214,255,0.2)); color: #e8eaf6; }

  .btn-extract {
    padding: 12px 32px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    font-family: inherit; transition: 0.2s;
    box-shadow: 0 4px 24px rgba(255,45,149,0.3), 0 0 40px rgba(168,85,247,0.15);
    display: flex; align-items: center; gap: 8px;
  }
  .btn-extract:hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(255,45,149,0.45); }
  .btn-extract:disabled { opacity: 0.4; transform: none; cursor: not-allowed; box-shadow: none; }
  .btn-extract.loading .btn-text { display: none; }
  .btn-extract .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite;
    display: none;
  }
  .btn-extract.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .timing { font-size: 0.85rem; color: #64748b; }

  /* results */
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .results-grid { grid-template-columns: 1fr; } }

  .result-card {
    background: rgba(15,15,40,0.7); border: 1px solid rgba(255,255,255,0.05);
    border-radius: 20px; overflow: hidden; backdrop-filter: blur(20px);
  }
  .rc-header {
    padding: 14px 20px; font-weight: 700; font-size: 0.82rem;
    text-transform: uppercase; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .rc-e { background: linear-gradient(135deg, rgba(6,214,255,0.08), rgba(6,214,255,0.03)); color: var(--cyan); }
  .rc-r { background: linear-gradient(135deg, rgba(255,179,71,0.08), rgba(255,179,71,0.03)); color: var(--amber); }

  .count {
    font-size: 0.75rem; padding: 4px 12px; border-radius: 14px;
    background: rgba(255,255,255,0.05); color: #94a3b8;
  }

  .entity-grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 20px; }
  .entity-chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-radius: 14px; transition: 0.2s; cursor: default;
  }
  .e0 { background: rgba(6,214,255,0.08); border: 1px solid rgba(6,214,255,0.2); }
  .e1 { background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.2); }
  .e2 { background: rgba(255,45,149,0.08); border: 1px solid rgba(255,45,149,0.2); }
  .e3 { background: rgba(57,255,136,0.08); border: 1px solid rgba(57,255,136,0.2); }
  .e4 { background: rgba(255,179,71,0.08); border: 1px solid rgba(255,179,71,0.2); }

  .entity-chip:hover { transform: translateY(-2px); }
  .entity-chip .e-name { font-weight: 700; font-size: 0.92rem; }
  .entity-chip .e-type {
    font-size: 0.7rem; padding: 3px 10px; border-radius: 8px;
    font-weight: 600;
  }
  .e0 .e-name { color: var(--cyan); } .e0 .e-type { background: rgba(6,214,255,0.2); color: var(--cyan); }
  .e1 .e-name { color: var(--purple); } .e1 .e-type { background: rgba(168,85,247,0.2); color: var(--purple); }
  .e2 .e-name { color: var(--pink); } .e2 .e-type { background: rgba(255,45,149,0.2); color: var(--pink); }
  .e3 .e-name { color: var(--green); } .e3 .e-type { background: rgba(57,255,136,0.2); color: var(--green); }
  .e4 .e-name { color: var(--amber); } .e4 .e-type { background: rgba(255,179,71,0.2); color: var(--amber); }

  .relation-list { padding: 20px; }
  .relation-item {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-radius: 12px; margin-bottom: 8px; font-size: 0.88rem;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
    transition: 0.2s;
  }
  .relation-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
  .r-left, .r-right { font-weight: 700; color: #93c5fd; }
  .r-middle {
    font-size: 0.73rem; padding: 4px 12px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(255,179,71,0.2), rgba(255,45,149,0.1));
    color: var(--amber); font-weight: 600; white-space: nowrap;
  }
  .r-arrow { color: #475569; font-size: 0.8rem; }

  .json-box {
    padding: 20px; background: rgba(0,0,0,0.3); border-radius: 14px;
    margin: 20px; overflow-x: auto; max-height: 480px; overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.04);
  }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; line-height: 1.7; font-family: 'Cascadia Code', 'Fira Code', monospace; }
  .j-key { color: #c4b5fd; } .j-str { color: #6ee7b7; } .j-num { color: #ffa657; } .j-bool { color: #67e8f9; }

  .empty-state { text-align: center; padding: 60px 20px; color: #475569; font-size: 1rem; }
  .empty-state .icon { font-size: 3rem; margin-bottom: 14px; }

  .error-toast {
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25);
    border-radius: 14px; padding: 16px 20px; margin-bottom: 20px;
    color: #fca5a5; font-size: 0.88rem;
  }

  footer {
    text-align: center; padding: 40px 0 0; color: #475569; font-size: 0.8rem;
    border-top: 1px solid rgba(255,255,255,0.04); margin-top: 48px;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="app">
  <header>
    <div class="logo-row">
      <div class="logo-icon">&#10022;</div>
      <h1>结构化信息抽取</h1>
    </div>
    <p class="subtitle">Qwen2.5-1.5B-Instruct + LoRA &middot; InstructIE 数据集 &middot; 12 个主题领域 &middot; Parse 率 95.2%</p>
    <div class="badges">
      <div class="badge b-model">&#9670; Qwen2.5-1.5B</div>
      <div class="badge b-lora">&#9670; LoRA r=8</div>
      <div class="badge b-topics">&#9670; 12 Topics</div>
      <div class="badge b-parse">&#9670; Parse 95.2%</div>
    </div>
  </header>

  <div id="error" style="display:none"></div>

  <div class="card">
    <div class="card-header">输入文本</div>
    <textarea id="input" placeholder="输入一段中文文本，例如：&#10;乔布斯于1976年在美国加州创立了苹果公司，随后推出了iPhone、iPad等革命性产品。&#10;&#10;模型将自动抽取所有实体和关系..."></textarea>
    <div class="controls">
      <div class="task-select" id="taskSelect">
        <button class="task-btn active" data-task="ie_extraction">信息抽取</button>
        <button class="task-btn" data-task="relation_qa">关系问答</button>
        <button class="task-btn" data-task="entity_verification">事实核查</button>
      </div>
      <button class="btn-extract" id="btnExtract" onclick="extract()">
        <span class="btn-text">开始抽取</span><span class="spinner"></span>
      </button>
      <span class="timing" id="timing"></span>
    </div>
  </div>

  <div id="resultArea">
    <div class="empty-state">
      <div class="icon">&#128269;</div>
      <p>输入文本，点击"开始抽取"查看结构化结果</p>
    </div>
  </div>

  <footer>Qwen IE &middot; luminesyaya/qianwen &middot; vLLM Serving</footer>
</div>

<script>
const API = 'http://localhost:8000/v1/chat/completions';
const MODEL = 'outputs/qwen_merged';

document.getElementById('taskSelect').addEventListener('click', e => {
  if (!e.target.classList.contains('task-btn')) return;
  document.querySelectorAll('.task-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
});

function $(id) { return document.getElementById(id); }

async function extract() {
  const input = $('input').value.trim();
  if (!input) return;
  const task = document.querySelector('.task-btn.active').dataset.task;
  const btn = $('btnExtract');
  btn.classList.add('loading'); btn.disabled = true;
  $('error').style.display = 'none'; $('timing').textContent = '';

  const prompts = {
    ie_extraction: {
      system: '你是一个严格遵循 schema 的信息抽取助手。从文本中抽取所有实体和关系三元组，只输出 JSON。格式 {"entities":[{"entity":"名称","entity_type":"类型"}],"relations":[{"head":"主体","relation":"关系","tail":"客体"}]}。不附加解释。',
      user: `从以下文本中抽取实体和关系三元组：\n\n${input}`
    },
    relation_qa: {
      system: '你是一个关系问答助手，根据文本简洁回答问题。',
      user: `根据文本回答：\n\n${input}\n\n直接给出答案。`
    },
    entity_verification: {
      system: '你是一个事实核查助手，判断声明是否成立。',
      user: `根据文本判断：\n\n${input}\n\n回答"成立"或"不成立"并给出理由。`
    },
  };

  const t0 = performance.now();
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, messages: [{ role: 'system', content: prompts[task].system }, { role: 'user', content: prompts[task].user }], max_tokens: 1024, temperature: 0.1 }),
    });
    const data = await r.json();
    $('timing').textContent = `${((performance.now()-t0)/1000).toFixed(2)}s`;
    if (!data.choices) throw new Error(JSON.stringify(data));
    render(data.choices[0].message.content, task);
  } catch (e) {
    $('error').style.display = 'block';
    $('error').innerHTML = `<div class="error-toast">请求失败：${escapeHtml(e.message)}<br>请确认 vLLM 服务已启动（端口 8000）</div>`;
  }
  btn.classList.remove('loading'); btn.disabled = false;
}

function render(reply, task) {
  const json = tryParse(reply);
  if (task === 'ie_extraction' && json?.entities && json?.relations) return renderIE(json);
  if (json) return renderJSON(json);
  $('resultArea').innerHTML = `<div class="card"><div class="json-box"><pre>${escapeHtml(reply)}</pre></div></div>`;
}

function tryParse(text) {
  const cs = [text.trim()], m = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
  if (m) cs.push(m[1].trim());
  for (const c of cs) { try { return JSON.parse(c); } catch {} }
  return null;
}

function renderIE(json) {
  const colors = ['e0','e1','e2','e3','e4'];
  const entitiesHtml = json.entities.map((e,i) => {
    const c = colors[i % colors.length];
    return `<div class="entity-chip ${c}"><span class="e-name">${escapeHtml(e.entity||e.entity_name||'?')}</span><span class="e-type">${escapeHtml(e.entity_type||e.type||'?')}</span></div>`;
  }).join('');

  const relationsHtml = json.relations.map(r =>
    `<div class="relation-item"><span class="r-left">${escapeHtml(r.head||r.subject||'?')}</span><span class="r-arrow">&#8594;</span><span class="r-middle">${escapeHtml(r.relation||r.predicate||'?')}</span><span class="r-arrow">&#8594;</span><span class="r-right">${escapeHtml(r.tail||r.object||'?')}</span></div>`
  ).join('');

  $('resultArea').innerHTML = `
    <div class="results-grid">
      <div class="result-card"><div class="rc-header rc-e"><span>实体</span><span class="count">${json.entities.length} 个</span></div><div class="entity-grid">${entitiesHtml||'<div class="empty-state">无</div>'}</div></div>
      <div class="result-card"><div class="rc-header rc-r"><span>关系三元组</span><span class="count">${json.relations.length} 条</span></div><div class="relation-list">${relationsHtml||'<div class="empty-state">无</div>'}</div></div>
    </div>`;
}

function renderJSON(json) {
  $('resultArea').innerHTML = `<div class="card"><div class="json-box"><pre>${syntaxHighlight(JSON.stringify(json,null,2))}</pre></div></div>`;
}

function syntaxHighlight(j) {
  return j.replace(/("(?:[^"\\]|\\.)*")\s*:/g, '<span class="j-key">$1</span>:')
          .replace(/: "(?:[^"\\]|\\.)*"/g, m => ': <span class="j-str">'+m.slice(2)+'</span>')
          .replace(/: (\d+)/g, ': <span class="j-num">$1</span>')
          .replace(/: (true|false)/g, ': <span class="j-bool">$1</span>');
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
